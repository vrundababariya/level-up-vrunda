<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#F5F1ED"/>
  
  <!-- Decorative leaves -->
  <g fill="none" stroke="#6B4456" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top left leaf -->
    <path d="M 70 40 Q 60 60 70 90" opacity="0.8"/>
    <path d="M 65 50 Q 68 60 70 75"/>
    
    <!-- Top center leaf -->
    <path d="M 100 30 Q 105 55 100 90"/>
    <path d="M 95 45 Q 98 60 100 80"/>
    
    <!-- Top right leaf -->
    <path d="M 130 45 Q 140 65 135 95"/>
    <path d="M 132 55 Q 138 70 135 85"/>
    
    <!-- Middle left leaf -->
    <path d="M 50 95 Q 45 115 55 145"/>
    <path d="M 52 105 Q 48 120 53 140"/>
    
    <!-- Bottom right leaf -->
    <path d="M 145 120 Q 155 140 150 165"/>
    <path d="M 147 130 Q 152 145 150 160"/>
  </g>
  
  <!-- Woman's profile -->
  <g fill="#6B4456">
    <!-- Hair -->
    <path d="M 110 50 Q 125 45 130 65 Q 132 80 128 95 L 110 95 Z"/>
    <path d="M 110 50 Q 100 48 95 58 Q 92 70 95 85 L 110 90 Z"/>
    
    <!-- Head/Face -->
    <ellipse cx="110" cy="85" rx="18" ry="22"/>
    
    <!-- Chin -->
    <path d="M 95 100 Q 110 108 125 100"/>
    
    <!-- Neck -->
    <path d="M 105 107 L 108 130"/>
    <path d="M 115 107 L 112 130"/>
    
    <!-- Shoulder -->
    <path d="M 108 130 Q 95 135 85 140 L 85 150 L 120 145 Z"/>
  </g>
  
  <!-- Face details -->
  <circle cx="108" cy="80" r="1.5" fill="#F5F1ED"/>
</svg>